name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installs every plugin from this marketplace the way a user does and checks that the bundled
  # binaries arrived and run. powershell-lsp is local and always tested. The other plugins come
  # from separate repositories that are not public yet; they are tested only when the secret
  # PLUGINS_READ_TOKEN (a read-only token that can clone them) is set, and skipped otherwise.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PLUGINS_READ_TOKEN: ${{ secrets.PLUGINS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Let git read the private plugin repositories
        if: env.PLUGINS_READ_TOKEN != ''
        run: |
          git config --global url."https://x-access-token:${PLUGINS_READ_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${PLUGINS_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Private plugins are not tested without the token
        if: env.PLUGINS_READ_TOKEN == ''
        run: echo "::warning::PLUGINS_READ_TOKEN is not set, so session-index and code-index-search are not installed or tested."
      - run: claude plugin validate .
      - run: claude plugin marketplace add "$PWD"
      - run: |
          # specs-index is added here (and to the binary check below) once its repository is published.
          plugins=powershell-lsp
          [ -n "$PLUGINS_READ_TOKEN" ] && plugins="$plugins session-index code-index-search"
          for p in $plugins; do
            claude plugin install "$p@wammy-plugins"
          done
          claude plugin list
      - name: Bundled binaries are there, executable, and run
        if: env.PLUGINS_READ_TOKEN != ''
        run: |
          cache="${CLAUDE_CODE_PLUGIN_CACHE_DIR:-$HOME/.claude/plugins}/cache/wammy-plugins"
          for d in session-index code-index-search; do
            test -d "$cache/$d" || { echo "missing $d"; exit 1; }
          done
          si=$(find "$cache/session-index" -maxdepth 3 -path '*/bin/session-index' | head -1)
          ci=$(find "$cache/code-index-search" -maxdepth 3 -path '*/bin/code-index' | head -1)
          test -n "$si" && test -n "$ci"
          sh "$si" version
          sh "$ci" version
          # the executable bit must survive the install copy
          test -x "$si" && echo "launcher is executable"
